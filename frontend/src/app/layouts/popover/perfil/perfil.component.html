<div class="relative inline-block">
  <!-- Botão que abre o perfil -->
  <button
    (click)="onAlternarPerfil()"
    type="button"
    aria-label="Abrir perfil do usuário"
    class="flex size-9 items-center justify-center overflow-hidden rounded-full border-2 border-purple-400 bg-gray-200 transition hover:brightness-95"
  >
    <img class="size-full object-cover" [src]="avatarUsuario" alt="" />
  </button>

  <!-- Caixa do perfil -->
  <div
    [class.hidden]="!perfilAberto"
    class="absolute right-0 top-full z-50 mt-3 flex w-[320px] max-w-[calc(100vw-2rem)] max-h-[calc(100vh-5rem)] flex-col overflow-hidden rounded-xl bg-white shadow-2xl transition-colors duration-300 dark:bg-gray-800"
  >
    <!-- Cabeçalho -->
    <div class="shrink-0 p-4">
      <div class="flex items-center gap-3">
        <div
          class="size-14 shrink-0 overflow-hidden rounded-full border-4 border-purple-300 dark:border-purple-700 bg-gray-200"
        >
          <img class="size-full object-cover" [src]="avatarUsuario" alt="" />
        </div>

        <div class="flex min-w-0 flex-1 items-center gap-2">
          <div class="min-w-0 flex-1">
            <p class="truncate text-sm font-medium text-gray-900 dark:text-gray-100">
              {{ nomeUsuario }}
            </p>

            <p class="truncate text-xs text-gray-500 dark:text-gray-200">{{ emailUsuario }}</p>
          </div>

          <button
            type="button"
            (click)="onAlternarTema()"
            [attr.aria-pressed]="modoEscuro"
            [attr.aria-label]="modoEscuro ? 'Ativar modo claro' : 'Ativar modo escuro'"
            class="relative size-9 shrink-0 rounded-full text-gray-600 transition hover:bg-gray-100 dark:hover:bg-gray-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-purple-600"
          >
            <span class="sr-only">{{ modoEscuro ? 'Modo escuro' : 'Modo claro' }}</span>
            <span class="relative mx-auto block size-6" aria-hidden="true">
              <svg
                class="absolute inset-0 size-6 transition-all duration-300 ease-out"
                [class.z-10]="!modoEscuro"
                [class.scale-150]="!modoEscuro"
                [class.opacity-100]="!modoEscuro"
                [class.scale-25]="modoEscuro"
                [class.opacity-0]="modoEscuro"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                xmlns="http://www.w3.org/2000/svg"
                version="1.1"
                viewBox="0 0 1024 1024"
              >
                <path d="M512 512m-256 0a256 256 0 1 0 512 0 256 256 0 1 0-512 0Z" fill="#F5B62F" />
                <path
                  d="M488 72a24 24 0 0 1 48 0v96a24 24 0 0 1-48 0z m368 416h96a24 24 0 0 1 0 48h-96a24 24 0 0 1 0-48zM488 856a24 24 0 0 1 48 0v96a24 24 0 0 1-48 0zM72 488h96a24 24 0 0 1 0 48H72a24 24 0 0 1 0-48zM806.156 183.902a24 24 0 0 1 33.94 33.94l-67.88 67.884a24 24 0 0 1-33.94-33.94z m-33.94 554.372l67.88 67.882a24 24 0 0 1-33.94 33.94l-67.88-67.88a24 24 0 0 1 33.94-33.94z m-520.432 0a24 24 0 0 1 33.94 33.94l-67.88 67.884a24 24 0 0 1-33.94-33.94z m-33.94-554.372l67.88 67.882a24 24 0 0 1-33.94 33.94l-67.88-67.88a24 24 0 0 1 33.94-33.94z"
                  fill="#E77D38"
                />
              </svg>
              <svg
                class="absolute inset-0 size-6 transition-all duration-300 ease-out"
                [class.z-10]="modoEscuro"
                [class.scale-110]="modoEscuro"
                [class.opacity-100]="modoEscuro"
                [class.scale-25]="!modoEscuro"
                [class.opacity-0]="!modoEscuro"
                [class.translate-x-1]="modoEscuro"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  fill-rule="evenodd"
                  clip-rule="evenodd"
                  d="M22 12.0004C22 17.5232 17.5228 22.0004 12 22.0004C10.8358 22.0004 9.71801 21.8014 8.67887 21.4357C8.24138 20.3772 8 19.217 8 18.0004C8 15.7792 8.80467 13.7459 10.1384 12.1762C11.31 13.8818 13.2744 15.0004 15.5 15.0004C17.8615 15.0004 19.9289 13.741 21.0672 11.8572C21.3065 11.4612 22 11.5377 22 12.0004Z"
                  fill="#ffffff"
                />
                <path
                  d="M2 12C2 16.3586 4.78852 20.0659 8.67887 21.4353C8.24138 20.3768 8 19.2166 8 18C8 15.7788 8.80467 13.7455 10.1384 12.1758C9.42027 11.1303 9 9.86422 9 8.5C9 6.13845 10.2594 4.07105 12.1432 2.93276C12.5392 2.69347 12.4627 2 12 2C6.47715 2 2 6.47715 2 12Z"
                  fill="#ffffff"
                />
              </svg>
            </span>
          </button>
        </div>
      </div>

      <!-- Ações -->
      <div class="mt-3 flex flex-col gap-2 ">
        <button
          class="flex items-center justify-center rounded-full bg-gray-100 px-4 py-2 text-xs transition hover:bg-gray-200 dark:bg-slate-600 dark:text-white dark:hover:bg-slate-700"
        >
          Mudar de conta
        </button>

        <button
          class="rounded-full bg-blue-500 px-4 py-2 text-xs text-white transition hover:bg-blue-600 dark:bg-blue-600 dark:hover:bg-blue-800"
        >
          Enviar feedback
        </button>
      </div>
    </div>

    <!-- Abas -->
    <div class="flex shrink-0 border-b border-gray-200">
      <button
        *ngFor="let aba of ['perfil', 'unidade', 'aluno']"
        (click)="onSelecionarAba(aba)"
        class="flex-1 border-b-2 px-3 py-3 text-xs capitalize transition"
        [ngClass]="
          abaAtiva === aba
            ? 'border-purple-600 text-purple-700 dark:border-violet-400 dark:text-violet-400'
            : 'border-transparent text-gray-600 hover:bg-gray-50 dark:text-slate-300 dark:hover:bg-gray-600 dark:hover:text-gray-200'
        "
      >
        {{ aba }}
      </button>
    </div>

    <!-- Conteúdo -->
    <div class="min-h-0 flex-1 overflow-y-auto bg-purple-50/70 dark:bg-slate-700/70 p-4">
      <div
        *ngIf="abaAtiva === 'perfil'"
        class="rounded-xl border border-gray-100 border-l-4 border-l-purple-600 bg-white p-3 shadow-sm dark:bg-slate-700 dark:border-gray-800 dark:border-l-indigo-400 dark:shadow-lg"
      >
        <p class="text-xs font-semibold text-gray-900 dark:text-gray-100">Desenvolvedor Portal</p>

        <p class="mt-1 text-xs text-gray-500 dark:text-gray-300">Casa Publicadora Brasileira - Editora</p>
      </div>

      <div class="dark:text-gray-100" *ngIf="abaAtiva === 'unidade'">Conteúdo da unidade.</div>

      <div class="dark:text-gray-100" *ngIf="abaAtiva === 'aluno'">Conteúdo do aluno.</div>
    </div>

    <!-- Rodapé -->
    <div class="shrink-0 border-t border-slate-500 bg-white p-4 dark:bg-gray-700">
      <button
        (click)="onSair()"
        class="mb-3 flex w-full items-center gap-3 rounded-full bg-purple-200 px-4 py-3 text-sm font-semibold text-purple-900 transition hover:bg-purple-300 dark:bg-slate-600 dark:text-fuchsia-300 dark:hover:bg-slate-800"
      >
        <span>⇥</span>
        Sair
      </button>

      <button
        (click)="onSair()"
        class="flex w-full items-center gap-3 rounded-full bg-purple-700 px-4 py-3 text-sm font-semibold text-white transition hover:bg-purple-800 dark:bg-violet-500 dark:hover:bg-violet-900"
      >
        <span>⏻</span>
        Sair Seguro
      </button>

      <div class="mt-3 flex justify-between px-2 text-[10px] text-gray-400">
        <span>© Portal Educacional</span>
        <span>Versão 4.41.18</span>
      </div>
    </div>
  </div>
</div>

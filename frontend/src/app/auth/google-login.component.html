<main class="flex min-h-screen items-center justify-center bg-slate-50 px-4 py-10">
  <section class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-xl">
    <div class="mx-auto mb-6 flex size-14 items-center justify-center rounded-2xl bg-indigo-100 text-indigo-700">
      <svg viewBox="0 0 24 24" class="size-7" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8 3v2m8-2v2M4 9h16M5 5h14a1 1 0 0 1 1 1v13H4V6a1 1 0 0 1 1-1Z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="m8 14 2 2 5-5" />
      </svg>
    </div>

    <h1 class="text-2xl font-bold text-slate-900">Portal Agenda Escolar</h1>
    <p class="mt-2 text-sm text-slate-600">Entre com sua conta Google para continuar.</p>

    <div class="mt-8 flex min-h-11 justify-center" #googleButton></div>

    <p *ngIf="carregando" class="mt-3 text-sm text-slate-500" role="status">
      Preparando o acesso…
    </p>
    <p *ngIf="erro" class="mt-4 rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700" role="alert">
      {{ erro }}
    </p>
  </section>
</main>

<main class="flex min-h-screen items-center justify-center bg-slate-50 px-4 py-10">
  <section class="w-full max-w-lg rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-xl">
    <div class="mx-auto mb-5 flex size-14 items-center justify-center rounded-full bg-amber-100 text-amber-700" aria-hidden="true">
      <svg viewBox="0 0 24 24" class="size-7" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="9" />
        <path stroke-linecap="round" d="M12 7v5l3 2" />
      </svg>
    </div>
    <h1 class="text-2xl font-bold text-slate-900">Acesso aguardando aprovação</h1>
    <p class="mt-3 text-sm text-slate-600">
      Sua conta foi criada. Um administrador precisa atribuir seu perfil antes que você possa acessar as agendas.
    </p>
    <p class="mt-2 text-sm font-medium text-slate-700">{{ auth.user?.email }}</p>
    <p *ngIf="error" class="mt-4 text-sm text-red-700" role="alert">{{ error }}</p>
    <div class="mt-7 flex flex-col justify-center gap-3 sm:flex-row">
      <button
        type="button"
        (click)="verificarAprovacao()"
        [disabled]="checking"
        class="rounded-lg bg-indigo-600 px-5 py-3 font-semibold text-white transition hover:bg-indigo-700 disabled:opacity-60"
      >
        {{ checking ? 'Verificando…' : 'Verificar acesso' }}
      </button>
      <button
        type="button"
        (click)="auth.logout()"
        class="rounded-lg border border-slate-300 px-5 py-3 font-semibold text-slate-700 transition hover:bg-slate-50"
      >
        Sair
      </button>
    </div>
  </section>
</main>

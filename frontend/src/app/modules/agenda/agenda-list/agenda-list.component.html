<main class="min-w-0 px-2 py-2 sm:px-3 lg:px-3">
  <section class="min-w-0 rounded-lg border bg-white p-4 shadow-sm dark:border-slate-700 dark:bg-slate-800 sm:p-6">
    <app-list-agenda
      [agendas]="agendas"
      [agendaSelecionadaId]="agendaSelecionadaId"
      [canDelete]="isAdministrador"
      [carregando]="carregando"
      [erro]="erro"
      (selecionar)="onSelecionarAgenda($event)"
      (excluir)="onExcluirAgenda($event)"
    ></app-list-agenda>
  </section>
</main>
